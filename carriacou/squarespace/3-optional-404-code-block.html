#cl-404 :is(input,button,textarea,select){appearance:none;-webkit-appearance:none;border-radius:0;box-shadow:none;margin:0;height:auto;min-width:0;background-image:none}
#cl-404 :is(li,dt,dd,dl,address,label,legend,figcaption,small,blockquote){margin:0}
#cl-404 label{display:inline}
#cl-404 a{text-decoration:none}
#cl-404 :is(ul,ol){margin:0;padding:0;list-style:none}
#cl-404 :is(svg,img){max-width:100%}
#cl-404{--frost:#F5F8F9;--deep:#0B1F2A;--galv:#98A4AB;--amber:#E8A00D;--slate:#4F6169;--line:rgba(11,31,42,.16)}
#cl-404 *{box-sizing:border-box}
#cl-404{margin:0;background:var(--frost);color:var(--deep);font-family:"CL Archivo","CL Archivo Fallback",Arial,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;display:grid;grid-template-rows:auto 1fr}
#cl-404 ::selection{background:var(--amber);color:var(--deep)}
#cl-404 :focus-visible{outline:2px solid var(--amber);outline-offset:3px}
#cl-404 .hdr{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px}
#cl-404 .wordmark{display:flex;align-items:center;gap:10px;font-family:"CL Archivo","CL Archivo Fallback Wide",Arial,sans-serif;font-stretch:125%;font-weight:700;font-size:14px;text-decoration:none;color:inherit}
#cl-404 .wordmark .logo{height:20px;width:auto;display:block}
#cl-404 .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
#cl-404 .cl-404-main{display:grid;gap:48px;align-items:center;max-width:1280px;width:100%;margin:0 auto;padding:48px 24px 96px}
@media(min-width:900px){#cl-404 .cl-404-main{grid-template-columns:minmax(0,5fr) minmax(0,7fr);padding:64px 48px 128px}}
#cl-404 h1{font-family:"CL Archivo","CL Archivo Fallback Wide",Arial,sans-serif;font-stretch:125%;font-weight:700;font-size:clamp(36px,5vw,72px);line-height:1;letter-spacing:-.03em;margin:0 0 24px -.04em;text-wrap:balance}
#cl-404 p{margin:0;max-width:44ch;color:var(--slate)}
#cl-404 .btn{display:inline-flex;align-items:center;min-height:48px;padding:12px 20px;margin-top:32px;border:1.5px solid var(--amber);background:var(--amber);color:var(--deep);font-weight:500;text-decoration:none;transition:background-color 140ms cubic-bezier(.33,1,.68,1)}
#cl-404 .btn:hover{background:#C98A08;border-color:#C98A08}
#cl-404 .btn:focus-visible{outline-color:var(--deep)}
#cl-404 .btn:active{transform:translateY(1px)}
#cl-404 svg.pv{width:100%;height:auto;font-family:inherit;font-size:13px}
#cl-404 .pv text{fill:var(--slate);font-size:12px}
#cl-404 .pv .big{fill:var(--deep);font-family:"CL Archivo","CL Archivo Fallback Wide",Arial,sans-serif;font-stretch:125%;font-weight:700;font-size:22px}
</style>
