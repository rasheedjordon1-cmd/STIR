<!-- STIR — paste into Settings > Advanced > Code Injection > HEADER.
     NOT into Design > Custom CSS: Squarespace compiles that field with
     LESS, which tries to evaluate calc(var(--stage-ar) * 1) as
     arithmetic, throws, and silently drops the whole stylesheet. Code
     Injection is passed through untouched. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://stirnyc.netlify.app/assets/stir-squarespace.26e3f464e6.css">
<script>
  /* Where the footer script should load the hero loop from. Without
     this it uses its own relative default, which on this host resolves
     to <your-domain>/assets/... — a 404, after which the hero quietly
     drops back to the still image and never moves. */
  window.STIR_ASSETS = 'https://stirnyc.netlify.app/assets/';
</script>
<style>
  /* Carried inline so the cobalt is painted before the stylesheet
     arrives; otherwise the first frame is a white Squarespace page. */
  body { background: #0451AB; }
</style>
