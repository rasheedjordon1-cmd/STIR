#cl-root :is(h1,h2,h3,h4,h5,h6,p,li,dt,dd,address,legend,label,figcaption,a,small,strong,b,button,input,textarea,select){font-family:inherit;font-size:inherit;line-height:inherit;color:inherit;font-weight:inherit;letter-spacing:inherit;text-transform:none;font-style:normal;text-shadow:none}
#cl-root :is(h1,h2,h3,h4,h5,h6,p,li,dt,dd,address,legend,label,figcaption){white-space:normal}
#cl-root :is(input,button,textarea,select){appearance:none;-webkit-appearance:none;border-radius:0;box-shadow:none;margin:0;height:auto;min-width:0;background-image:none}
#cl-root :is(li,dt,dd,dl,address,label,legend,figcaption,small,blockquote){margin:0}
#cl-root label{display:inline}
#cl-root a{text-decoration:none}
#cl-root :is(ul,ol){margin:0;padding:0;list-style:none}
#cl-root :is(svg,img){max-width:100%}
#cl-root{
  --frost:#F5F8F9;
  --deep:#0B1F2A;
  --galv:#98A4AB;
  --amber:#E8A00D;
  --amber-deep:#C98A08;
  --spice:#14513C;
  --slate:#4F6169;
  --line:rgba(11,31,42,.16);
  --line-strong:rgba(11,31,42,.32);
  --line-dark:rgba(245,248,249,.18);
  --sans:"CL Archivo","CL Archivo Fallback",Arial,sans-serif;
  --wide:"CL Archivo","CL Archivo Fallback Wide",Arial,sans-serif;
  --ease-reveal:cubic-bezier(.16,1,.3,1);
  --ease-state:cubic-bezier(.65,0,.35,1);
  --ease-micro:cubic-bezier(.33,1,.68,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --dur-micro:140ms;
  --dur-state:320ms;
  --dur-reveal:560ms;
  --dur-sequence:900ms;
  --s1:4px;--s2:8px;--s3:16px;--s4:24px;--s5:32px;--s6:48px;--s7:64px;--s8:96px;--s9:128px;--s10:160px;
  --hdr:56px;
  --p:0;
}
#cl-root *,#cl-root *::before,#cl-root *::after{box-sizing:border-box}
html:has(#cl-root){scroll-padding-top:72px}
#cl-root{margin:0;background:var(--frost);color:var(--deep);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:clip}
#cl-root ::selection{background:var(--amber);color:var(--deep)}
#cl-root :focus-visible{outline:2px solid var(--amber);outline-offset:3px}
#cl-root img,#cl-root svg{display:block;max-width:100%}
#cl-root a{color:inherit}
#cl-root h1,#cl-root h2,#cl-root h3,#cl-root h4,#cl-root p,#cl-root ul,#cl-root ol,#cl-root dl,#cl-root dd,#cl-root figure{margin:0}
#cl-root ul,#cl-root ol{padding:0;list-style:none}
#cl-root button{font:inherit;color:inherit}
#cl-root b,#cl-root strong{font-weight:500}
#cl-root [hidden]{display:none!important}
#cl-root .wrap{max-width:1280px;margin:0 auto;padding:0 var(--s4)}
@media(min-width:768px){#cl-root .wrap{padding:0 var(--s6)}}
#cl-root .sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#cl-root .num{font-variant-numeric:tabular-nums lining-nums}
#cl-root .h1,#cl-root .h2,#cl-root .h3,#cl-root .big,#cl-root .zone-name,#cl-root .wordmark{font-family:var(--wide);font-stretch:125%;font-weight:700;font-variant-numeric:tabular-nums}
#cl-root .h1{font-size:clamp(36px,4.5vw,64px);line-height:.98;letter-spacing:-.03em;margin-left:-.04em;text-wrap:balance;hanging-punctuation:first last}
#cl-root .h2{font-size:clamp(28px,3.6vw,48px);line-height:1.02;letter-spacing:-.02em;margin-left:-.03em;max-width:22ch;text-wrap:balance}
#cl-root .h3{font-size:22px;line-height:1.1;letter-spacing:-.01em}
#cl-root .big{font-size:clamp(36px,5vw,64px);line-height:1;letter-spacing:-.02em}
#cl-root .lead{font-size:clamp(18px,1.6vw,22px);line-height:1.45;max-width:36ch;text-wrap:pretty}
#cl-root .copy{max-width:64ch;text-wrap:pretty}
#cl-root .copy+.copy{margin-top:var(--s3)}
#cl-root .muted{color:var(--slate)}
#cl-root .dark .muted{color:var(--galv)}
#cl-root .small{font-size:14px;line-height:1.5}
#cl-root .tk{color:var(--slate);border-bottom:1px dashed var(--galv);cursor:help;text-decoration:none;white-space:nowrap}
#cl-root .dark .tk{color:var(--galv);border-bottom-color:rgba(152,164,171,.6)}
#cl-root .sec{padding:var(--s8) 0}
@media(min-width:768px){#cl-root .sec{padding:var(--s9) 0}}
#cl-root .dark{background:var(--deep);color:var(--frost)}
#cl-root .dark ::selection{background:var(--amber);color:var(--deep)}
#cl-root .sec-head{margin-bottom:var(--s6)}
@media(min-width:768px){#cl-root .sec-head{margin-bottom:var(--s7)}}
#cl-root .sec-head .lead{margin-top:var(--s4)}
#cl-root .btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:48px;padding:12px 20px;border:1.5px solid var(--deep);background:transparent;color:var(--deep);font-weight:500;font-size:16px;line-height:1.2;text-decoration:none;cursor:pointer;border-radius:0;transition:background-color var(--dur-micro) var(--ease-micro),color var(--dur-micro) var(--ease-micro),border-color var(--dur-micro) var(--ease-micro),transform var(--dur-micro) var(--ease-micro);-webkit-tap-highlight-color:transparent}
#cl-root .btn:hover{background:var(--deep);color:var(--frost)}
#cl-root .btn:active{transform:translateY(1px)}
#cl-root .btn:disabled,#cl-root .btn[aria-disabled=true]{border-color:var(--galv);color:var(--galv);background:transparent;cursor:not-allowed;transform:none}
#cl-root .btn-primary{background:var(--amber);border-color:var(--amber);color:var(--deep)}
#cl-root .btn-primary:hover{background:var(--amber-deep);border-color:var(--amber-deep);color:var(--deep)}
#cl-root .btn-primary:focus-visible{outline-color:var(--deep)}
#cl-root .btn-primary:disabled,#cl-root .btn-primary[aria-disabled=true]{background:var(--galv);border-color:var(--galv);color:var(--deep)}
#cl-root .dark .btn{border-color:var(--frost);color:var(--frost)}
#cl-root .dark .btn:hover{background:var(--frost);color:var(--deep)}
#cl-root .dark .btn-primary{border-color:var(--amber);background:var(--amber);color:var(--deep)}
#cl-root .dark .btn-primary:hover{background:var(--amber-deep);border-color:var(--amber-deep)}
#cl-root .mag{display:inline-block;padding:40px;margin:-40px}
#cl-root .mag .btn{will-change:auto;transition:background-color var(--dur-micro) var(--ease-micro),color var(--dur-micro) var(--ease-micro),transform 420ms var(--ease-spring)}
#cl-root .mag.live .btn{transition:background-color var(--dur-micro) var(--ease-micro),color var(--dur-micro) var(--ease-micro),transform 60ms linear}
#cl-root .text-link{text-decoration:underline;text-underline-offset:.18em;text-decoration-thickness:1px;transition:text-decoration-color var(--dur-micro) var(--ease-micro)}
#cl-root .text-link:hover{text-decoration-color:var(--amber);text-decoration-thickness:2px}
#cl-root .skip{position:absolute;left:var(--s3);top:-100px;z-index:100;padding:12px 16px;background:var(--deep);color:var(--frost);text-decoration:none;font-weight:500}
#cl-root .skip:focus{top:var(--s3)}
#cl-root .hdr{position:sticky;top:0;z-index:50;height:var(--hdr);background:var(--frost);border-bottom:1px solid var(--line)}
#cl-root .hdr .wrap{height:100%;display:flex;align-items:center;gap:var(--s4)}
#cl-root .wordmark{display:flex;align-items:center;text-decoration:none;color:var(--deep)}
#cl-root .wordmark .logo{height:20px;width:auto;display:block}
@media(max-width:767px){#cl-root .wordmark .logo{height:15px}}
#cl-root .readout{display:flex;align-items:baseline;gap:var(--s2);margin-left:auto;font-size:14px;white-space:nowrap;min-width:0}
#cl-root .readout .ro-label{color:var(--slate)}
#cl-root .readout .ro-zone{font-weight:500;min-width:6ch}
#cl-root .readout .ro-temp{font-variant-numeric:tabular-nums;color:var(--slate)}
#cl-root .roll{display:inline-block;height:1.2em;line-height:1.2;overflow:hidden;vertical-align:bottom}
#cl-root .roll-d{display:inline-block;vertical-align:top}
#cl-root .roll-d>span{display:block;transition:transform 180ms var(--ease-state)}
#cl-root .roll-d i{display:block;height:1.2em;line-height:1.2;font-style:normal}
#cl-root .hero-done .mask{overflow:visible}
#cl-root .hdr-tel{font-variant-numeric:tabular-nums;text-decoration:none;font-weight:500;white-space:nowrap}
#cl-root .hdr-tel:hover{text-decoration:underline;text-underline-offset:.18em}
#cl-root .hdr .btn{min-height:40px;padding:8px 16px;font-size:14px}
@media(max-width:767px){#cl-root .hdr .btn,#cl-root .hdr-tel{display:none}
#cl-root .readout .ro-label{display:none}}
@media(max-width:400px){#cl-root .readout .ro-temp{display:none}}
#cl-root .hero{padding:var(--s6) 0 var(--s8)}
#cl-root .hero-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s6) var(--s6);align-items:center}
@media(min-width:960px){#cl-root .hero{padding:var(--s7) 0 var(--s9)}
#cl-root .hero-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
#cl-root .hero-copy{position:relative;z-index:2;margin-right:calc(-1 * var(--s5))}}
#cl-root .hero-copy .lead{margin-top:var(--s4)}
#cl-root .hero-cta{display:flex;flex-wrap:wrap;gap:var(--s3) var(--s4);margin-top:var(--s5);align-items:center}
#cl-root .hero-cta .mag{margin:-40px}
#cl-root .mask{overflow:hidden}
#cl-root .mask>*{display:block;transform:translateY(0)}
.cl-js #cl-root .rv .mask>*{transform:translateY(102%);transition:transform var(--dur-reveal) var(--ease-reveal)}
.cl-js #cl-root .rv.in .mask>*{transform:translateY(0)}
.cl-js #cl-root .rv .mask:nth-child(2)>*{transition-delay:60ms}
.cl-js #cl-root .rv .mask:nth-child(3)>*{transition-delay:120ms}
#cl-root .pv-wrap{position:relative}
#cl-root .pv{width:100%;height:auto;aspect-ratio:960/620;font-family:var(--sans);font-size:13px;color:var(--deep);overflow:visible;-webkit-user-select:none;user-select:none}
#cl-root .pv text{fill:currentColor;font-variant-numeric:tabular-nums}
#cl-root .pv .lbl{font-size:12px;fill:var(--slate)}
#cl-root .pv .pv-outline{fill:none;stroke:var(--deep);stroke-width:1.25;vector-effect:non-scaling-stroke}
#cl-root .pv .hair{fill:none;stroke:var(--deep);stroke-width:.75;stroke-opacity:.5;vector-effect:non-scaling-stroke}
#cl-root .pv .apron{fill:url(#cl-hatch)}
#cl-root .pv .pz{cursor:pointer;outline:none}
#cl-root .pv .pz-fill{fill:var(--deep);transition:fill var(--dur-micro) var(--ease-micro),fill-opacity var(--dur-micro) var(--ease-micro)}
#cl-root .pv .pz[data-zone=freezer] .pz-fill{fill-opacity:.13}
#cl-root .pv .pz[data-zone=cooler] .pz-fill{fill-opacity:.065}
#cl-root .pv .pz[data-zone=dry] .pz-fill{fill-opacity:.02}
#cl-root .pv .pz:hover .pz-fill{fill-opacity:.2}
#cl-root .pv .pz-grid{fill:url(#cl-units);pointer-events:none}
#cl-root .pv .pz-name{font-family:var(--wide);font-stretch:125%;font-weight:700;font-size:22px;letter-spacing:-.01em}
#cl-root .pv .pz-temp{font-size:15px;font-weight:500}
#cl-root .pv .pz-temp .tk{fill:var(--slate)}
#cl-root .pv .pz-count{font-size:12px;fill:var(--slate)}
#cl-root .pv .pz-ring{fill:none;stroke:var(--amber);stroke-width:2;vector-effect:non-scaling-stroke;opacity:0;transition:opacity var(--dur-micro) var(--ease-micro)}
#cl-root .pv .pz:focus-visible .pz-ring{opacity:1}
#cl-root .pv .pz{transition:opacity 200ms var(--ease-state)}
#cl-root .pv .pz.sel .pz-fill{fill:var(--amber);fill-opacity:1;transition:fill 200ms var(--ease-state),fill-opacity 200ms var(--ease-state)}
#cl-root .pv.has-sel .pz:not(.sel){opacity:.4}
#cl-root .pv .pz.sel .pz-count{fill:var(--deep)}
#cl-root .pv .dock-door{fill:var(--deep)}
#cl-root .pv .trailer{fill:none;stroke:var(--deep);stroke-width:.75;stroke-dasharray:3 3;stroke-opacity:.6;vector-effect:non-scaling-stroke}
#cl-root .pv .dock-num{font-family:var(--wide);font-stretch:125%;font-weight:700;font-size:14px}
#cl-root .pv .unit-legend{fill:var(--deep)}
#cl-root .pv-reticle{position:absolute;left:0;top:0;pointer-events:none;opacity:0;transition:opacity var(--dur-micro) var(--ease-micro);will-change:transform}
#cl-root .pv-wrap.ret .pv-reticle{opacity:1}
#cl-root .pv-reticle svg{width:32px;height:32px;margin:-16px 0 0 -16px}
#cl-root .pv-reticle b{position:absolute;left:14px;top:12px;font-weight:500;font-size:12px;white-space:nowrap;background:var(--frost);padding:2px 6px;border:1px solid var(--line)}
@media(hover:hover) and (pointer:fine){.cl-js #cl-root .pv-wrap.ret,.cl-js #cl-root .pv-wrap.ret *{cursor:none}}
#cl-root .pv-panel{margin-top:var(--s4);min-height:128px;border-top:1px solid var(--line);padding-top:var(--s3);position:relative}
#cl-root .pv-panel .pv-hint{color:var(--slate);transition:opacity var(--dur-state) var(--ease-state)}
#cl-root .pv-panel .pv-spec,#cl-root .pv-panel .pv-cta{position:absolute;left:0;right:0;opacity:0;transform:translateY(8px);transition:opacity var(--dur-state) var(--ease-state),transform var(--dur-state) var(--ease-state);pointer-events:none}
#cl-root .pv-panel .pv-spec{top:var(--s3);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}
#cl-root .pv-panel .pv-cta{top:calc(var(--s3) + 56px);transition-delay:40ms}
#cl-root .pv-panel.open .pv-hint{opacity:0}
#cl-root .pv-panel.open .pv-spec,#cl-root .pv-panel.open .pv-cta{opacity:1;transform:none;pointer-events:auto}
#cl-root .pv-spec dt{font-size:12px;color:var(--slate)}
#cl-root .pv-spec dd{font-weight:500;font-variant-numeric:tabular-nums}
#cl-root .pv-cta .btn{min-height:40px;padding:8px 16px;font-size:14px}
@media(max-width:480px){#cl-root .pv-panel .pv-spec{grid-template-columns:1fr 1fr}
#cl-root .pv-panel{min-height:200px}
#cl-root .pv-panel .pv-cta{top:calc(var(--s3) + 120px)}}
.cl-js #cl-root .pv .pv-outline{stroke-dasharray:1;stroke-dashoffset:1;animation:cl-draw 420ms var(--ease-state) forwards}
.cl-js #cl-root .pv .pz-fill,.cl-js #cl-root .pv .pz-grid,.cl-js #cl-root .pv .pz text,.cl-js #cl-root .pv .pv-late{opacity:0;animation:cl-fadein 200ms var(--ease-reveal) forwards}
.cl-js #cl-root .pv .pz[data-zone=dry] *{animation-delay:420ms}
.cl-js #cl-root .pv .pz[data-zone=cooler] *{animation-delay:510ms}
.cl-js #cl-root .pv .pz[data-zone=freezer] *{animation-delay:600ms}
.cl-js #cl-root .pv .pv-late{animation-delay:380ms}
.cl-js #cl-root .hero-copy .lead .mask>*,.cl-js #cl-root .hero-copy .hero-cta .mask>*{transform:translateY(102%);animation:cl-rise 280ms var(--ease-reveal) forwards}
.cl-js #cl-root .hero-copy .lead .mask>*{animation-delay:220ms}
.cl-js #cl-root .hero-copy .hero-cta .mask>*{animation-delay:300ms}
@keyframes cl-draw{to{stroke-dashoffset:0}}
@keyframes cl-fadein{to{opacity:1}}
@keyframes cl-rise{to{transform:translateY(0)}}
#cl-root .zones{position:relative;isolation:isolate}
#cl-root .scrub{position:absolute;inset:0;pointer-events:none;z-index:-1}
#cl-root .scrub-cold{background:#DFE6EA;opacity:calc(1 - var(--p))}
#cl-root .scrub-warm{background:#F6F5F2;opacity:var(--p)}
@supports (animation-timeline:view()){.cl-js #cl-root .scrub-cold{animation:cl-scrubCold linear both;animation-timeline:view();animation-range:entry 0% exit 100%}
.cl-js #cl-root .scrub-warm{animation:cl-scrubWarm linear both;animation-timeline:view();animation-range:entry 0% exit 100%}}
@keyframes cl-scrubCold{from{opacity:1}to{opacity:0}}
@keyframes cl-scrubWarm{from{opacity:0}to{opacity:1}}
#cl-root .zone-grid{display:grid;grid-template-columns:minmax(0,1fr);border-top:1px solid var(--line-strong)}
@media(min-width:768px){#cl-root .zone-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
#cl-root .zone{position:relative;padding:var(--s4) 0 var(--s5);border-bottom:1px solid var(--line)}
@media(min-width:768px){#cl-root .zone{padding:var(--s5) var(--s4) var(--s6) 0}
#cl-root .zone+.zone{padding-left:var(--s4);border-left:1px solid var(--line)}
#cl-root .zone:last-child{padding-right:0}}
#cl-root .zone-name{font-size:clamp(28px,3vw,40px);line-height:1;letter-spacing:-.02em}
#cl-root .zone dl{margin-top:var(--s4);display:grid;grid-template-columns:auto 1fr;gap:var(--s2) var(--s3);align-items:baseline}

#cl-root .zone dd{font-weight:500;font-variant-numeric:tabular-nums}
#cl-root .zone .cats{margin-top:var(--s4);color:var(--slate);max-width:32ch;text-wrap:pretty}
#cl-root .zone .cats b{color:var(--deep)}
#cl-root .zone .zone-cta{margin-top:var(--s4)}
#cl-root .frost{position:absolute;inset:-8px -8px -8px -28px;pointer-events:none;overflow:hidden}
#cl-root .frost svg{position:absolute;inset:0;width:100%;height:100%}
