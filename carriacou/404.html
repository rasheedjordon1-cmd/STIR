*{box-sizing:border-box}

.hdr{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px}
.wordmark{display:flex;align-items:center;gap:10px;font-family:"Archivo","Archivo Fallback Wide",Arial,sans-serif;font-stretch:125%;font-weight:700;font-size:14px;text-decoration:none;color:inherit}

h1{font-family:"Archivo","Archivo Fallback Wide",Arial,sans-serif;font-stretch:125%;font-weight:700;font-size:clamp(36px,5vw,72px);line-height:1;letter-spacing:-.03em;margin:0 0 24px -.04em;text-wrap:balance}
p{margin:0;max-width:44ch;color:var(--slate)}
.btn{display:inline-flex;align-items:center;min-height:48px;padding:12px 20px;margin-top:32px;border:1.5px solid var(--amber);background:var(--amber);color:var(--deep);font-weight:500;text-decoration:none;transition:background-color 140ms cubic-bezier(.33,1,.68,1)}
.btn:hover{background:#C98A08;border-color:#C98A08}
.btn:focus-visible{outline-color:var(--deep)}
.btn:active{transform:translateY(1px)}
svg.pv{width:100%;height:auto;font-family:inherit;font-size:13px}
.pv text{fill:var(--slate);font-size:12px}
.pv .big{fill:var(--deep);font-family:"Archivo","Archivo Fallback Wide",Arial,sans-serif;font-stretch:125%;font-weight:700;font-size:22px}
</style>
