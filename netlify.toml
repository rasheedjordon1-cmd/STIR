# ══════════════════════════════════════════════════════════════════
# STIR — static site. No framework, no bundler.
# The "build" step only stamps the live domain into the share meta
# (see scripts/prepare-deploy.sh); everything else is plain files.
#
# Deploy: connect this repo in Netlify → pick this branch → deploy.
# Inquiries: /contact.html is picked up by Netlify Forms automatically.
# Turn on notifications in Site configuration → Forms → Form notifications.
# ══════════════════════════════════════════════════════════════════

[build]
  command = "bash ./scripts/prepare-deploy.sh"
  publish = "."

# This deploy doubles as the asset origin for the Squarespace build,
# so /assets is served cross-origin. Fonts are the only thing that
# strictly needs CORS, but the whole folder is public static art.
# Fonts, images and video: the filename identifies the content, so a
# year of immutable caching is correct for them.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# The stylesheet and the script under their UNHASHED names are a
# different matter: their contents change while the name stays. The
# build serves fingerprinted copies to the site itself, but these
# names are still reachable from an old bookmark, so they must
# revalidate rather than pin for a year. Getting this wrong is what
# served a pre-rebuild stylesheet to every returning visitor.
#
# The Squarespace kit no longer appears here: it used to request
# /assets/stir-squarespace.css, a stable name under a year of
# immutable caching, so a browser that had once loaded the old sheet
# kept serving it no matter what was deployed. That stylesheet is now
# content-addressed (stir-squarespace.<hash>.css) and is covered by
# the /assets/* rule above, which is the correct policy for a name
# that changes whenever its contents do.
[[headers]]
  for = "/assets/stir.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/stir.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Resource-Policy = "cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Pretty URLs. Netlify will usually serve /about from about.html on its
# own, but every route the site links to is declared here rather than
# left to that default — the nav now depends on six of them.
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/businesses"
  to = "/businesses.html"
  status = 200

[[redirects]]
  from = "/creators"
  to = "/creators.html"
  status = 200

[[redirects]]
  from = "/collaborate"
  to = "/collaborate.html"
  status = 200

[[redirects]]
  from = "/labay"
  to = "/labay.html"
  status = 200
