<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG source, 1200 by 630</title>
<style>
@font-face{font-family:"Archivo";src:url(../fonts/archivo-display.woff2) format("woff2");font-weight:700;font-stretch:125%}
@font-face{font-family:"Archivo";src:url(../fonts/archivo-text.woff2) format("woff2");font-weight:400 500;font-stretch:100%}
body{margin:0;width:1200px;height:630px;background:#0B1F2A;color:#F5F8F9;font-family:Archivo,Arial,sans-serif;overflow:hidden;position:relative}
.copy{position:absolute;left:72px;top:72px;width:560px}
h1{margin:0;font-stretch:125%;font-weight:700;font-size:64px;line-height:.98;letter-spacing:-.03em;margin-left:-.04em}
p{margin:28px 0 0;font-size:24px;line-height:1.4;color:#98A4AB}
.wm{position:absolute;left:72px;bottom:64px;display:flex;align-items:center;gap:14px;font-stretch:125%;font-weight:700;font-size:20px}
.wm svg{width:30px;height:30px}
.pv{position:absolute;right:56px;top:96px;width:520px;height:auto}
.pv text{fill:#98A4AB;font-size:14px}
.pv .zn{fill:#F5F8F9;font-stretch:125%;font-weight:700;font-size:26px}
</style>
</head>
<body>
<div class="copy">
  <h1>Freezer, cooler, and dry pallet storage in Waterbury, Connecticut.</h1>
  <p>85 South Leonard Street. Four docks. Pallet positions by the month. Refrigerated delivery into the DC window.</p>
</div>
<div class="wm">
  <svg viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="20" height="16" fill="none" stroke="#F5F8F9" stroke-width="1.5"/><path d="M7.5 1v12M14.5 1v12M1 13h20" fill="none" stroke="#F5F8F9" stroke-width="1"/><path d="M3 17v4M8 17v4M14 17v4M19 17v4" stroke="#F5F8F9" stroke-width="1.5"/></svg>

</div>

  <defs>

  <rect x="48" y="56" width="288" height="392" fill="#F5F8F9" fill-opacity=".14"/>
  <rect x="336" y="56" width="288" height="392" fill="#F5F8F9" fill-opacity=".07"/>

  <text class="zn" x="352" y="92">Cooler</text>
  <text class="zn" x="640" y="92">Dry</text>
  <text x="64" y="486">Staging apron</text>

  <g fill="#E8A00D"><rect x="196" y="506" width="40" height="6"/><rect x="372" y="506" width="40" height="6"/><rect x="548" y="506" width="40" height="6"/><rect x="724" y="506" width="40" height="6"/></g>

</html>
